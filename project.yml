# =============================================================================
#  Fovea — native WYSIWYG markdown editor for macOS
#
#  This file is the SOURCE OF TRUTH for the Xcode project. `Fovea.xcodeproj`
#  is generated and git-ignored: it is never touched directly. After adding a
#  Swift file, rerun `xcodegen generate`, or the build fails with
#  "cannot find X in scope".
#
#  The name is short and has no space, so a single form is enough: "Fovea"
#  is used for the bundle, the executable, the Swift module, the Finder and
#  the app menu.
# =============================================================================
name: Fovea

options:
  bundleIdPrefix: com.byelior
  deploymentTarget:
    # macOS 15, and not earlier: the core of this app IS TextKit 2, and
    # TextKit 2 carries fragment and attachment bugs on Ventura that would
    # need manual workarounds. See §3.2 of docs/PRINCIPLES.md.
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  # The cmark-gfm AST exposed in Swift, with a SourceRange on every node.
  # This is exactly what §3.3 depends on: the AST is never re-serialized, it
  # is only used to know WHERE to set attributes in the source text.
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.8.0"

targets:
  Fovea:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # The icon. `Fovea.icon` is an Icon Composer document; actool compiles
      # it and Info.plist points at it by name. Without this path it wouldn't
      # reach the bundle and the Finder would show the generic icon.
      - path: App/Resources
    dependencies:
      - package: Markdown
    settings:
      base:
        PRODUCT_NAME: Fovea
        PRODUCT_BUNDLE_IDENTIFIER: com.byelior.fovea
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Fovea
        CODE_SIGN_ENTITLEMENTS: App/Fovea.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Hardened runtime OFF: only required for Apple notarization, which
        # requires a paid developer account. Flip to YES the day the
        # Developer ID exists (§10).
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"

        # **Apple silicon only.**
        #
        # The build was universal, and half of a 4.8 MB download served Intel
        # Macs — while `docs/ARCHITECTURE.md` had claimed arm64 for as long as
        # it has existed. The claim is now true. An app whose argument is that
        # it weighs nothing should not carry a second architecture it does not
        # target.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO

        # **What ships is stripped.**
        #
        # These three are off by default and there is no reason for it here:
        # dead code stripping drops what nothing reaches, and the symbol table
        # is a debugging aid that the released binary has no use for. Together
        # they take the binary from 2.33 MB to 1.44 MB, on top of the 51 % the
        # architecture just saved. Debug builds are untouched — the settings
        # only apply to the installed product.
        DEAD_CODE_STRIPPING: YES
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_INSTALLED_PRODUCT: YES
        # `debugging`, not `all`: `all` removes symbols the dynamic linker and
        # the signature still need, and the build fails outright.
        STRIP_STYLE: debugging

        # Zero warnings tolerated. Set on the TARGET, not the project: at the
        # project level, the flag would also reach the SwiftPM dependencies,
        # which compile with -suppress-warnings, and the two together would
        # be a hard compiler error.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # The Markdown/ layer is tested without an interface: this is where the
  # §3.3 UTF-8 → UTF-16 range conversion lives, and it must be exact down to
  # the character on accented text, emoji and CJK.
  FoveaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Fovea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byelior.fovea.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  Fovea:
    build:
      targets:
        Fovea: all
        FoveaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoveaTests
